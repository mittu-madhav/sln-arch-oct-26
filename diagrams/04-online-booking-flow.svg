ffff"/><text x="300" y="704" text-anchor="middle" font-family="Open Sans, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#545b64">Yes</text><path d="M300,816 L300,880" fill="none" stroke="#545b64" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="160" y="20" width="280" height="48" rx="24" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/><text x="300" y="48" text-anchor="middle" font-family="Open Sans, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#232f3e">Devotee books (Idempotency-Key)</text><rect x="160" y="120" width="280" height="56" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/><text x="300" y="152" text-anchor="middle" font-family="Open Sans, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#232f3e">Server reads price from catalogue</text><polygon points="300.0,220 440,270.0 300.0,320 160,270.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/><text x="300" y="266" text-anchor="middle" font-family="Open Sans, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#232f3e">Quota left? Atomic</text><text x="300" y="282" text-anchor="middle" font-family="Open Sans, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#232f3e">conditional UPDATE</text><rect x="580" y="240" width="200" height="48" rx="24" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/><text x="680" y="268" text-anchor="middle" font-family="Open Sans, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#232f3e">409 Sold out</text><rect x="160" y="380" width="280" height="56" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/><text x="300" y="412" text-anchor="middle" font-family="Open Sans, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#232f3e">Create hold, expires in 15 min</text><rect x="160" y="480" width="280" height="56" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/><text x="300" y="512" text-anchor="middle" font-family="Open Sans, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill=